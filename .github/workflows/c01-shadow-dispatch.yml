name: C01 Independent Shadow Dispatch

on:
  push:
    branches:
      - "ag/C01-independent-shadow-dispatch"
  pull_request:
    paths:
      - ".actiongate/c01-shadow-dispatch/**"
      - ".github/workflows/c01-shadow-dispatch.yml"

permissions:
  contents: read

jobs:
  verify-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: structural_dispatch_check
        run: |
          python3 .actiongate/c01-shadow-dispatch/check_dispatch.py
          python3 .actiongate/c01-shadow-dispatch/check_ready_binding.py

      - name: mutation_selftest
        run: |
          python3 .actiongate/c01-shadow-dispatch/selftest.py
          python3 .actiongate/c01-shadow-dispatch/check_ready_binding.py --selftest
